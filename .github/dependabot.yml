version: 2

updates:
  # Ruby (GitHub Pages / Jekyll)
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps(ruby)"
      include: "scope"
    allow:
      - dependency-type: "all"
    groups:
      ruby-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # JavaScript (if package.json exists)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:15"
      timezone: "UTC"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    allow:
      - dependency-type: "all"
    groups:
      npm-patch-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
