<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>Munenori IIDA | Portfolio</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #fff; --bg2: #f7f7f5; --text: #111; --muted: #888;
    --border: #e8e8e4; --card-bg: #fff; --tag-bg: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --bg2: #1a1a1a; --text: #f0f0ee; --muted: #666; --border: #2a2a2a; --card-bg: #1a1a1a; --tag-bg: #222; }
  }
  html { scroll-behavior: smooth; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; font-size: 15px; }

  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 0 2rem; height: 56px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .nav-logo { font-size: 13px; font-weight: 500; letter-spacing: 0.05em; color: var(--text); text-decoration: none; }
  .nav-links { display: flex; gap: 2rem; align-items: center; }
  .nav-links a { font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--text); }

  section { padding: 40px 2rem; max-width: 960px; margin: 0 auto; }
  section:first-of-type { padding-top: calc(56px + 24px); }

  .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
  .section-title { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }
  .work-card { background: var(--card-bg); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; transition: background 0.15s; }
  .work-card:hover { background: var(--bg2); }
  .work-thumb { width: 100%; aspect-ratio: 16/9; background: var(--bg2); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .work-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .work-thumb svg { width: 32px; height: 32px; opacity: 0.15; fill: var(--text); }
  .work-meta { display: flex; align-items: center; justify-content: space-between; }
  .work-date { font-size: 11px; color: var(--muted); }
  .work-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .work-tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--tag-bg); color: var(--muted); }
  .work-title { font-size: 15px; font-weight: 500; line-height: 1.35; }
  .work-desc { font-size: 13px; color: var(--muted); line-height: 1.65; flex: 1; }
  .work-links { display: flex; gap: 10px; }
  .work-link { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); text-decoration: none; transition: color 0.15s, border-color 0.15s; }
  .work-link:hover { color: var(--text); border-color: var(--text); }
  .work-link svg { width: 14px; height: 14px; fill: currentColor; }

  footer { border-top: 1px solid var(--border); padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
  .footer-copy { font-size: 12px; color: var(--muted); }
  .footer-links { display: flex; gap: 16px; align-items: center; }
  .footer-link { display: flex; align-items: center; justify-content: center; color: var(--text); text-decoration: none; transition: opacity 0.2s; }
  .footer-link:hover { opacity: 0.5; }
  .footer-link svg { width: 16px; height: 16px; fill: currentColor; }
</style>
</head>
